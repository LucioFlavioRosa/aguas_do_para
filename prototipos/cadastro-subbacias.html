<main id="content" class="main-container" role="main">
	<h1>Cadastro de Sub-bacias / Setores Hidráulicos</h1>
	<section class="upload-section" aria-label="Upload de Excel">
		<form id="form-upload-excel" enctype="multipart/form-data" method="post" style="display: flex; align-items: center; gap: 16px;">
			<label for="excel-file">Importar dados via Excel:</label>
			<input type="file" id="excel-file" name="excel-file" accept=".xlsx,.xls,.csv" aria-label="Arquivo Excel para upload">
			<button type="submit" class="btn-primary">Enviar</button>
		</form>
	</section>
	<section class="table-section" aria-label="Tabela de Sub-bacias">
		<table class="subbacias-table" aria-label="Cadastro de Sub-bacias">
			<thead>
				<tr>
					<th>Nome da Sub-bacia</th>
					<th>Código</th>
					<th>Sistema</th>
					<th>Município</th>
					<th>Sub-bacia Origem</th>
					<th>Sub-bacia Destino</th>
					<th>Cobertura Atual (%)</th>
					<th>Ações</th>
				</tr>
			</thead>
			<tbody id="subbacias-tbody">
				<!-- Linhas dinâmicas inseridas via JS -->
				<tr>
					<td><input type="text" value="" placeholder="Nome" aria-label="Nome da Sub-bacia"></td>
					<td><input type="text" value="" placeholder="Código" aria-label="Código"></td>
					<td><input type="text" value="" placeholder="Sistema" aria-label="Sistema"></td>
					<td><input type="text" value="" placeholder="Município" aria-label="Município"></td>
					<td><input type="text" value="" placeholder="Origem" aria-label="Sub-bacia Origem"></td>
					<td><input type="text" value="" placeholder="Destino" aria-label="Sub-bacia Destino"></td>
					<td><input type="number" value="" min="0" max="100" placeholder="%" aria-label="Cobertura Atual (%)"></td>
					<td class="actions">
						<button type="button" class="btn-secondary action-btn" aria-label="Salvar"><span aria-hidden="true">💾</span></button>
						<button type="button" class="btn-secondary action-btn" aria-label="Excluir"><span aria-hidden="true">🗑️</span></button>
					</td>
				</tr>
			</tbody>
		</table>
		<button type="button" class="btn-primary" style="margin-top:16px;" id="add-row-btn">Adicionar Nova Sub-bacia</button>
	</section>
	<a id="link-unifilar" href="visualizacao-unifilar.html">Visualizar Unifilar</a>
</main>

<script>
// Adicionar nova linha na tabela
const addRowBtn = document.getElementById('add-row-btn');
const tbody = document.getElementById('subbacias-tbody');
addRowBtn.addEventListener('click', function() {
	const tr = document.createElement('tr');
	tr.innerHTML = `
		<td><input type="text" value="" placeholder="Nome" aria-label="Nome da Sub-bacia"></td>
		<td><input type="text" value="" placeholder="Código" aria-label="Código"></td>
		<td><input type="text" value="" placeholder="Sistema" aria-label="Sistema"></td>
		<td><input type="text" value="" placeholder="Município" aria-label="Município"></td>
		<td><input type="text" value="" placeholder="Origem" aria-label="Sub-bacia Origem"></td>
		<td><input type="text" value="" placeholder="Destino" aria-label="Sub-bacia Destino"></td>
		<td><input type="number" value="" min="0" max="100" placeholder="%" aria-label="Cobertura Atual (%)"></td>
		<td class="actions">
			<button type="button" class="btn-secondary action-btn" aria-label="Salvar"><span aria-hidden="true">💾</span></button>
			<button type="button" class="btn-secondary action-btn" aria-label="Excluir"><span aria-hidden="true">🗑️</span></button>
		</td>
	`;
	tbody.appendChild(tr);
});
// Excluir linha
tbody.addEventListener('click', function(e) {
	if (e.target.closest('button[aria-label="Excluir"]')) {
		const tr = e.target.closest('tr');
		tr.remove();
	}
});
// Salvar linha (apenas placeholder visual)
tbody.addEventListener('click', function(e) {
	if (e.target.closest('button[aria-label="Salvar"]')) {
		alert('Linha salva (exemplo visual, não persistente)');
	}
});
// Upload Excel (apenas visual, sem backend)
document.getElementById('form-upload-excel').addEventListener('submit', function(e) {
	e.preventDefault();
	alert('Upload de Excel simulado (exemplo visual, não persistente)');
});
</script>
