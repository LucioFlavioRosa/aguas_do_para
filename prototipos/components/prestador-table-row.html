<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Linha de Tabela de Prestador</title>
  <link rel='stylesheet' id='wp-block-library-css' href='https://www.aegea.com.br/wp-includes/css/dist/block-library/style.min.css?ver=6.8.3' media='all' />
  <link rel='stylesheet' id='hello-elementor-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/reset.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='hello-elementor-theme-style-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/theme.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='elementor-frontend-css' href='https://www.aegea.com.br/wp-content/plugins/elementor/assets/css/frontend.min.css?ver=3.32.5' media='all' />
  <style>
    .prestadores-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }
    .prestadores-table th, .prestadores-table td {
      padding: 12px 10px;
      text-align: left;
      font-size: 1rem;
      border-bottom: 1px solid #E2E5F0;
    }
    .prestadores-table th {
      background: #f6f8fa;
      font-weight: 700;
      color: #0027BD;
    }
    .prestadores-table tr:last-child td {
      border-bottom: none;
    }
    .prestadores-table .badge {
      background: #0027BD;
      color: #fff;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-left: 4px;
    }
    .prestadores-table .stars {
      color: #FFD600;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    .prestadores-table .vehicle-icon {
      vertical-align: middle;
      margin-right: 4px;
    }
    @media (max-width: 700px) {
      .prestadores-table, .prestadores-table thead, .prestadores-table tbody, .prestadores-table tr, .prestadores-table th, .prestadores-table td {
        display: block;
      }
      .prestadores-table tr {
        margin-bottom: 16px;
        border-bottom: 2px solid #f0f4ff;
      }
      .prestadores-table th {
        display: none;
      }
      .prestadores-table td {
        padding: 10px 8px;
        border-bottom: none;
        position: relative;
      }
      .prestadores-table td:before {
        content: attr(data-label);
        font-weight: 700;
        color: #0027BD;
        display: block;
        margin-bottom: 2px;
      }
    }
  </style>
</head>
<body style="background: #f6f8fa; padding: 32px;">
  <table class="prestadores-table" aria-label="Lista de prestadores">
    <thead>
      <tr>
        <th scope="col">Selecionar</th>
        <th scope="col">Nome</th>
        <th scope="col">Endereço</th>
        <th scope="col">Veículo</th>
        <th scope="col">Serviços</th>
        <th scope="col">Avaliação</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-label="Selecionar"><input type="checkbox" aria-label="Selecionar prestador João Silva"></td>
        <td data-label="Nome">João Silva</td>
        <td data-label="Endereço">Trav. Pará, 100 - Belém</td>
        <td data-label="Veículo">
          <span class="vehicle-icon" title="Moto">
            <svg width="22" height="16" viewBox="0 0 22 16" fill="none" aria-hidden="true"><path d="M2 13.5A2.5 2.5 0 1 0 2 8.5a2.5 2.5 0 0 0 0 5zm0 1.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm18-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm0 1.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8zM6.5 10h9l-2.5-4h-4L6.5 10z" fill="#0027BD"/></svg>
          </span>
          Moto
        </td>
        <td data-label="Serviços"><span class="badge">12</span></td>
        <td data-label="Avaliação">
          <span class="stars" aria-label="4 de 5 estrelas">★★★★☆</span>
        </td>
      </tr>
      <tr>
        <td data-label="Selecionar"><input type="checkbox" aria-label="Selecionar prestador Maria Souza"></td>
        <td data-label="Nome">Maria Souza</td>
        <td data-label="Endereço">Rua das Acácias, 55 - Ananindeua</td>
        <td data-label="Veículo">
          <span class="vehicle-icon" title="Carro">
            <svg width="22" height="16" viewBox="0 0 22 16" fill="none" aria-hidden="true"><rect x="2" y="6" width="18" height="6" rx="2" fill="#0027BD"/><circle cx="6" cy="13" r="2" fill="#0027BD"/><circle cx="16" cy="13" r="2" fill="#0027BD"/></svg>
          </span>
          Carro
        </td>
        <td data-label="Serviços"><span class="badge">27</span></td>
        <td data-label="Avaliação">
          <span class="stars" aria-label="5 de 5 estrelas">★★★★★</span>
        </td>
      </tr>
      <tr>
        <td data-label="Selecionar"><input type="checkbox" aria-label="Selecionar prestador Pedro Lima"></td>
        <td data-label="Nome">Pedro Lima</td>
        <td data-label="Endereço">Av. Independência, 200 - Marabá</td>
        <td data-label="Veículo">
          <span class="vehicle-icon" title="Moto">
            <svg width="22" height="16" viewBox="0 0 22 16" fill="none" aria-hidden="true"><path d="M2 13.5A2.5 2.5 0 1 0 2 8.5a2.5 2.5 0 0 0 0 5zm0 1.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm18-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm0 1.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8zM6.5 10h9l-2.5-4h-4L6.5 10z" fill="#0027BD"/></svg>
          </span>
          Moto
        </td>
        <td data-label="Serviços"><span class="badge">8</span></td>
        <td data-label="Avaliação">
          <span class="stars" aria-label="3 de 5 estrelas">★★★☆☆</span>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
