<div class="modal-overlay" id="modalDetalhes" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,39,189,0.10);z-index:1000;align-items:center;justify-content:center;">
  <div class="modal-content" style="background:#fff;border-radius:16px;max-width:520px;width:95vw;padding:32px;box-shadow:0 8px 40px rgba(0,39,189,0.18);position:relative;">
    <button class="modal-close" aria-label="Fechar" id="closeModal" style="position:absolute;top:18px;right:18px;background:none;border:none;font-size:1.6rem;color:#0027BD;cursor:pointer;">&times;</button>
    <h2 id="modal-title" style="color:#0027BD;font-size:1.3rem;margin-bottom:12px;">Detalhes</h2>
    <div id="modal-body">
      <!-- Conteúdo dinâmico inserido via JavaScript -->
    </div>
  </div>
</div>
<script>
// Função utilitária para abrir o modal com conteúdo dinâmico
function abrirModalDetalhes(titulo, conteudoHTML) {
  var modal = document.getElementById('modalDetalhes');
  document.getElementById('modal-title').textContent = titulo || 'Detalhes';
  document.getElementById('modal-body').innerHTML = conteudoHTML || '';
  modal.classList.add('active');
  modal.style.display = 'flex';
  modal.focus();
}
document.getElementById('closeModal').onclick = function() {
  var modal = document.getElementById('modalDetalhes');
  modal.classList.remove('active');
  modal.style.display = 'none';
};
document.getElementById('modalDetalhes').addEventListener('click', function(e) {
  if (e.target === this) {
    this.classList.remove('active');
    this.style.display = 'none';
  }
});
</script>
