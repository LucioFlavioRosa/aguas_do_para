<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Header - Componente</title>
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-includes/css/dist/block-library/style.min.css?ver=6.8.3">
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/reset.css?ver=3.4.5">
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/theme.css?ver=3.4.5">
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/header-footer.css?ver=3.4.5">
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-content/plugins/elementor/assets/css/frontend.min.css?ver=3.32.5">
  <style>
    .header-aegea {
      background: var(--e-global-color-primary, #0027BD);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      position: relative;
      z-index: 10;
    }
    .header-aegea .header-logo {
      display: flex;
      align-items: center;
    }
    .header-aegea .header-logo img {
      height: 40px;
      border-radius: 8px;
      background: #fff;
      padding: 4px 8px;
    }
    .header-aegea nav {
      display: flex;
      gap: 30px;
    }
    .header-aegea nav a {
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 500;
      padding: 6px 0;
      border-radius: 6px;
      transition: background 0.2s, text-decoration 0.2s;
    }
    .header-aegea nav a:hover, .header-aegea nav a.active {
      text-decoration: underline;
      background: rgba(255,255,255,0.08);
    }
    .header-profile {
      position: relative;
      margin-left: 25px;
      cursor: pointer;
    }
    .header-profile svg {
      width: 32px;
      height: 32px;
      fill: #fff;
      border-radius: 50%;
      background: rgba(0,0,0,0.07);
      padding: 4px;
      transition: box-shadow 0.2s;
    }
    .header-profile:hover svg {
      box-shadow: 0 0 0 2px #fff3;
    }
    .profile-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 44px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      min-width: 170px;
      overflow: hidden;
      z-index: 100;
    }
    .profile-dropdown a {
      display: block;
      padding: 12px 20px;
      color: #333;
      text-decoration: none;
      font-size: 16px;
      transition: background 0.18s;
    }
    .profile-dropdown a:hover {
      background: #f5f5f5;
      color: var(--e-global-color-primary, #0027BD);
    }
    .header-profile.open .profile-dropdown {
      display: block;
    }
    @media (max-width: 800px) {
      .header-aegea nav {
        gap: 16px;
      }
      .header-aegea {
        padding: 10px 10px;
      }
    }
  </style>
</head>
<body style="margin:0;">
  <header class="header-aegea">
    <a class="header-logo" href="dashboard.html" aria-label="Ir para o Dashboard">
      <img src="https://www.aegea.com.br/wp-content/uploads/2024/02/aegea.svg" alt="Logo da Aegea">
    </a>
    <nav aria-label="Menu principal">
      <a href="dashboard.html">Dashboard</a>
      <a href="simulacoes.html">Simulações</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="relatorios.html">Relatórios</a>
      <a href="configuracoes.html" class="active">Configurações</a>
    </nav>
    <div class="header-profile" tabindex="0" aria-label="Abrir menu de perfil">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="12" r="7"/><path d="M16 21c-6.075 0-11 2.239-11 5v2h22v-2c0-2.761-4.925-5-11-5z"/></svg>
      <div class="profile-dropdown" role="menu">
        <a href="configuracoes.html" role="menuitem">Meu Perfil</a>
        <a href="login.html" role="menuitem">Sair</a>
      </div>
    </div>
  </header>
  <script>
    // Dropdown profile menu
    const profile = document.querySelector('.header-profile');
    if(profile) {
      profile.addEventListener('click', function(e) {
        e.stopPropagation();
        profile.classList.toggle('open');
      });
      document.addEventListener('click', function() {
        profile.classList.remove('open');
      });
      profile.addEventListener('keydown', function(e) {
        if(e.key === 'Enter' || e.key === ' ') {
          profile.classList.toggle('open');
        }
      });
    }
  </script>
</body>
</html>
