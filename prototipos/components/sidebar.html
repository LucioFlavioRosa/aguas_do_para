  <style>
    .sidebar-aegea {
      background: #f5f5f5;
      width: 250px;
      height: 100vh;
      border-right: 1px solid #e0e0e0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9;
      box-shadow: 2px 0 8px rgba(0,0,0,0.03);
    }
    .sidebar-menu {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
    }
    .sidebar-menu li {
      margin: 0;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      font-size: 16px;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.17s, color 0.17s;
      font-weight: 400;
    }
    .sidebar-link.active, .sidebar-link:focus, .sidebar-link:hover {
      background: #e0e0e0;
      color: var(--e-global-color-primary, #0027BD);
      font-weight: bold;
      text-decoration: none;
    }
    .sidebar-link .icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-link .icon svg {
      width: 24px;
      height: 24px;
      fill: var(--e-global-color-primary, #0027BD);
      display: block;
    }
    @media (max-width: 900px) {
      .sidebar-aegea {
        width: 60px;
        padding: 10px 0;
      }
      .sidebar-link span {
        display: none;
      }
      .sidebar-link {
        justify-content: center;
        padding: 15px 0;
      }
    }
  </style>
</head>
