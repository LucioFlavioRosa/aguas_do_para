<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Input WhatsApp</title>
  <link rel='stylesheet' id='hello-elementor-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/reset.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='hello-elementor-theme-style-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/theme.css?ver=3.4.5' media='all' />
  <style>
    .wa-input-bar {
      display: flex;
      align-items: center;
      background: #f0f0f0;
      padding: 10px 12px;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      border-top: 1px solid #e0e0e0;
      box-shadow: 0 -1px 2px rgba(0,0,0,0.02);
    }
    .wa-input-bar .wa-btn {
      background: none;
      border: none;
      cursor: pointer;
      margin-right: 8px;
      color: #888;
      display: flex;
      align-items: center;
      font-size: 1.2rem;
    }
    .wa-input-bar .wa-btn:focus {
      outline: 2px solid #25d366;
    }
    .wa-input-bar .wa-input {
      flex: 1;
      border: none;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 1rem;
      margin-right: 8px;
      background: #fff;
      color: #222;
      box-shadow: 0 1px 2px rgba(0,0,0,0.01);
    }
    .wa-input-bar .wa-input:focus {
      outline: 2px solid #25d366;
    }
    .wa-input-bar .wa-send-btn {
      background: #25d366;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    .wa-input-bar .wa-send-btn:focus {
      outline: 2px solid #075e54;
    }
    .wa-input-bar .wa-send-btn:hover {
      background: #1ebea5;
    }
  </style>
</head>
<body style="margin:0;">
  <footer class="wa-input-bar" aria-label="Barra de envio de mensagem do WhatsApp">
    <button class="wa-btn" aria-label="Emoji">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10zm0-18c4.41 0 8 3.59 8 8s-3.59 8-8 8-8-3.59-8-8 3.59-8 8-8zm-4 7a1 1 0 100 2 1 1 0 000-2zm8 0a1 1 0 100 2 1 1 0 000-2zm-8.07 5.75a.75.75 0 011.06-.02A5.98 5.98 0 0012 17c1.5 0 2.87-.55 3.99-1.53a.75.75 0 111.02 1.1A7.47 7.47 0 0112 18.5c-1.85 0-3.56-.63-4.97-1.77a.75.75 0 01-.1-1.06z" fill="#888"/></svg>
    </button>
    <button class="wa-btn" aria-label="Anexar arquivo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.5 6.5v7a4.5 4.5 0 01-9 0v-7a3.5 3.5 0 017 0v7a2.5 2.5 0 01-5 0v-6" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <input type="text" class="wa-input" placeholder="Digite uma mensagem" aria-label="Digite uma mensagem" />
    <button class="wa-btn" aria-label="Gravar áudio">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 003-3V7a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a1 1 0 10-2 0 5 5 0 01-10 0 1 1 0 10-2 0 7 7 0 0014 0z" fill="#888"/></svg>
    </button>
    <button class="wa-send-btn" aria-label="Enviar mensagem">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.4 20.29l17.3-7.47a1 1 0 000-1.84L3.4 3.51A1 1 0 002 4.4v15.2a1 1 0 001.4.89z" fill="#fff"/></svg>
    </button>
  </footer>
</body>
</html>
