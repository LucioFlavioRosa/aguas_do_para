<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp - Pagamento Aprovado</title>
  <link rel='stylesheet' id='wp-block-library-css' href='https://www.aegea.com.br/wp-includes/css/dist/block-library/style.min.css?ver=6.8.3' media='all' />
  <link rel='stylesheet' id='hello-elementor-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/reset.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='hello-elementor-theme-style-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/theme.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='hello-elementor-header-footer-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/header-footer.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='elementor-frontend-css' href='https://www.aegea.com.br/wp-content/plugins/elementor/assets/css/frontend.min.css?ver=3.32.5' media='all' />
  <link rel='stylesheet' id='elementor-post-26397-css' href='https://www.aegea.com.br/wp-content/uploads/elementor/css/post-26397.css?ver=1766510004' media='all' />
  <link rel='stylesheet' id='elementor-post-26997-css' href='https://www.aegea.com.br/wp-content/uploads/elementor/css/post-26997.css?ver=1766510008' media='all' />
  <style>
    body {
      background: #ece5dd;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    .wa-container {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
      overflow: hidden;
      border: 1px solid #d1d7db;
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    .wa-header {
      background: #075e54;
      color: #fff;
      padding: 16px 16px 12px 16px;
      display: flex;
      align-items: center;
    }
    .wa-header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 12px;
      background: #fff;
      border: 2px solid #25d366;
    }
    .wa-header .wa-title {
      font-weight: 600;
      font-size: 1.1em;
    }
    .wa-chat {
      flex: 1;
      padding: 24px 12px 12px 12px;
      background: url('https://i.imgur.com/7vQbF2B.png') repeat;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .wa-msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 8px 8px 8px 0;
      background: #dcf8c6;
      align-self: flex-start;
      font-size: 1.04em;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      position: relative;
    }
    .wa-msg.wa-bot {
      background: #fff;
      border-radius: 8px 8px 0 8px;
      border: 1px solid #e1e1e1;
      color: #222;
      align-self: flex-start;
    }
    .wa-msg.wa-user {
      background: #dcf8c6;
      border-radius: 8px 8px 8px 0;
      align-self: flex-end;
      color: #222;
    }
    .wa-time {
      display: block;
      font-size: 0.85em;
      color: #888;
      margin-top: 4px;
      text-align: right;
    }
    .wa-footer {
      background: #f7f7f7;
      padding: 10px 16px;
      border-top: 1px solid #e1e1e1;
      display: flex;
      align-items: center;
    }
    .wa-footer input {
      flex: 1;
      border: none;
      background: #fff;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 1em;
      margin-right: 10px;
      outline: none;
    }
    .wa-footer button {
      background: #25d366;
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3em;
      transition: background .2s;
    }
    .wa-footer button:hover {
      background: #128c7e;
    }
  </style>
</head>
<body>
  <div class="wa-container" role="main">
    <div class="wa-header">
      <img src="https://www.aegea.com.br/wp-content/uploads/2024/02/aegea.svg" alt="Logo Aegea" aria-label="Logo da Aegea">
      <div>
        <div class="wa-title">Aegea Parceiros</div>
        <div style="font-size:0.95em;opacity:0.8;">online</div>
      </div>
    </div>
    <div class="wa-chat" aria-live="polite">
      <div class="wa-msg wa-bot">
        <strong>Parabéns! 🎉</strong><br>
        Seu serviço foi auditado e aprovado com sucesso.<br>
        O pagamento já está em processamento e será creditado em sua chave PIX cadastrada em até 2 dias úteis.<br>
        Obrigado por fazer parte da Rede de Parceiros Águas do Pará!
        <span class="wa-time">09:42</span>
      </div>
    </div>
    <div class="wa-footer" aria-label="Enviar mensagem">
      <input type="text" placeholder="Digite uma mensagem" disabled aria-disabled="true">
      <button title="Enviar" disabled aria-disabled="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M2 21l21-9-21-9v7l15 2-15 2z" fill="#fff"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
