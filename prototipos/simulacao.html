	<style>
		.simulacao-grid {
			display: grid;
			grid-template-columns: 1fr 1.2fr 1fr;
			gap: 32px;
			margin: 40px 0;
		}
		@media (max-width: 900px) {
			.simulacao-grid {
				grid-template-columns: 1fr;
			}
		}
		.painel {
			background: #fff;
			border-radius: 8px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.05);
			padding: 32px 24px;
			margin-bottom: 16px;
		}
		.painel label {
			display: block;
			font-weight: 600;
			margin-bottom: 8px;
			font-size: 1rem;
		}
		.painel select,
		.painel input[type="number"] {
			width: 100%;
			padding: 8px 12px;
			margin-bottom: 18px;
			border: 1px solid #d5d8dc;
			border-radius: 4px;
			font-size: 1rem;
		}
		.painel .painel-radio {
			margin-bottom: 18px;
		}
		.painel .painel-radio label {
			display: inline-block;
			margin-right: 24px;
			font-weight: 400;
		}
		.simulacao-actions {
			margin-top: 32px;
			text-align: right;
		}
		.simulacao-spinner {
			display: none;
			justify-content: center;
			align-items: center;
			margin-top: 24px;
		}
		.simulacao-spinner.active {
			display: flex;
		}
		.simulacao-spinner .loader {
			border: 4px solid #e0e0e0;
			border-top: 4px solid #0027BD;
			border-radius: 50%;
			width: 36px;
			height: 36px;
			animation: spin 1s linear infinite;
		}
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		.simulacao-voltar {
			display: inline-block;
			margin: 24px 0 0 0;
			color: #0027BD;
			font-weight: 500;
			text-decoration: underline;
		}
	</style>
	<script src="https://www.aegea.com.br/wp-includes/js/jquery/jquery.min.js?ver=3.7.1"></script>
	<script src="https://www.aegea.com.br/wp-includes/js/jquery/jquery-migrate.min.js?ver=3.4.1"></script>
	<script>
	function executarSimulacao() {
		document.getElementById('simulacao-spinner').classList.add('active');
		document.getElementById('btn-simular').disabled = true;
		setTimeout(function() {
			window.location.href = 'resultados.html';
		}, 1800);
	}
	</script>
</head>
<body class="wp-singular page-template-default page wp-custom-logo wp-embed-responsive wp-theme-hello-elementor hello-elementor-default elementor-default elementor-kit-25733">

		<div class="elementor-element elementor-element-6537c5b e-con-full e-flex e-con e-parent" data-id="6537c5b" data-element_type="container" id="header">
			<div class="elementor-element elementor-element-3bb71253 e-con-full e-flex e-con e-child" data-id="3bb71253" data-element_type="container">
				<a href="https://www.aegea.com.br" aria-label="Página inicial">
					<img src="https://www.aegea.com.br/wp-content/uploads/2024/02/aegea.svg" alt="Logo Aegea" width="117" height="48" />
				</a>
			</div>
			<nav class="elementor-nav-menu--main elementor-nav-menu__container elementor-nav-menu--layout-horizontal e--pointer-underline e--animation-fade" aria-label="Menu principal">
				<ul class="elementor-nav-menu">
					<li><a href="cadastro.html" class="elementor-item">Cadastro</a></li>
					<li><a href="simulacao.html" class="elementor-item elementor-item-active" aria-current="page">Simulação</a></li>
					<li><a href="resultados.html" class="elementor-item">Resultados</a></li>
				</ul>
			</nav>
		</div>
	</header>

	<main id="content" class="container" style="max-width:1200px;margin:0 auto;padding:32px 0;">
		<a href="cadastro.html" class="simulacao-voltar">&larr; Voltar para Cadastro</a>
		<h1 style="font-size:2rem;font-weight:700;margin:32px 0 24px 0;">Simulação de Priorização de Investimentos</h1>
		<div class="simulacao-grid">
			<!-- Painel de Filtros -->
			<section class="painel" aria-label="Painel de Filtros">
				<h2 style="font-size:1.2rem;font-weight:600;margin-bottom:16px;">Filtros</h2>
				<label for="filtro-unidade">Unidade de Negócio</label>
				<select id="filtro-unidade" class="elementor-field elementor-size-sm" name="unidade">
					<option value="">Selecione...</option>
					<option>Águas do Rio</option>
					<option>Águas do Pará</option>
					<option>Corsan</option>
				</select>
				<label for="filtro-bloco">Bloco</label>
				<select id="filtro-bloco" class="elementor-field elementor-size-sm" name="bloco">
					<option value="">Selecione...</option>
					<option>Bloco 1</option>
					<option>Bloco 2</option>
					<option>Bloco 3</option>
				</select>
				<label for="filtro-municipio">Município</label>
				<select id="filtro-municipio" class="elementor-field elementor-size-sm" name="municipio">
					<option value="">Selecione...</option>
					<option>Rio de Janeiro</option>
					<option>Belém</option>
					<option>Porto Alegre</option>
				</select>
				<label for="filtro-sistema">Sistema</label>
				<select id="filtro-sistema" class="elementor-field elementor-size-sm" name="sistema">
					<option value="">Selecione...</option>
					<option>Sistema 1</option>
					<option>Sistema 2</option>
				</select>
			</section>

			<!-- Painel de Restrições -->
			<section class="painel" aria-label="Painel de Restrições">
				<h2 style="font-size:1.2rem;font-weight:600;margin-bottom:16px;">Restrições</h2>
				<label for="capex-min">CAPEX (R$) Mínimo</label>
				<input type="number" id="capex-min" name="capex-min" min="0" placeholder="Valor mínimo">
				<label for="capex-max">CAPEX (R$) Máximo</label>
				<input type="number" id="capex-max" name="capex-max" min="0" placeholder="Valor máximo">
				<label for="cobertura-min">Incremento de Cobertura (%) Mínimo</label>
				<input type="number" id="cobertura-min" name="cobertura-min" min="0" max="100" placeholder="% mínimo">
				<label for="cobertura-max">Incremento de Cobertura (%) Máximo</label>
				<input type="number" id="cobertura-max" name="cobertura-max" min="0" max="100" placeholder="% máximo">
				<label for="extensao-min">Extensão de Rede (m) Mínima</label>
				<input type="number" id="extensao-min" name="extensao-min" min="0" placeholder="Metros mínimo">
				<label for="extensao-max">Extensão de Rede (m) Máxima</label>
				<input type="number" id="extensao-max" name="extensao-max" min="0" placeholder="Metros máximo">
			</section>

			<!-- Painel de Configuração -->
			<section class="painel" aria-label="Painel de Configuração">
				<h2 style="font-size:1.2rem;font-weight:600;margin-bottom:16px;">Configuração</h2>
				<div class="painel-radio">
					<label><input type="radio" name="funcao-objetivo" value="vpl-faturamento" checked> Maximizar VPL Faturamento</label>
					<label><input type="radio" name="funcao-objetivo" value="vpl-arrecadacao"> Maximizar VPL Arrecadação</label>
				</div>
				<div class="painel-checkbox">
					<input type="checkbox" id="plurianual" name="plurianual" />
					<label for="plurianual">Simulação Plurianual (5 anos)</label>
				</div>
				<div class="simulacao-actions">
					<button id="btn-simular" type="button" class="elementor-button elementor-size-lg" onclick="executarSimulacao()">
						<span class="elementor-button-content-wrapper">
							<span class="elementor-button-text">Executar Simulação</span>
						</span>
					</button>
				</div>
				<div id="simulacao-spinner" class="simulacao-spinner" aria-live="polite">
					<div class="loader" aria-label="Simulação em andamento"></div>
					<span style="margin-left:12px;">Executando simulação...</span>
				</div>
			</section>
		</div>
	</main>

	<!-- Footer -->
	<footer data-elementor-type="footer" data-elementor-id="26421" class="elementor elementor-26421 elementor-location-footer" data-elementor-post-type="elementor_library" style="background:#f7f7f7;padding:32px 0;margin-top:48px;">

				<div style="display:flex;align-items:center;gap:16px;">
					<img src="https://www.aegea.com.br/wp-content/uploads/2025/06/ae-verde.svg" alt="Logo Aegea Verde" width="48" height="48" />
					<span style="font-weight:700;font-size:1.1rem;">Aegea Saneamento</span>
				</div>
				<div style="font-size:0.95rem;color:#666;">&copy; 2026 Aegea. Todos os direitos reservados.</div>
			</div>
		</div>
	</footer>
</body>
</html>
