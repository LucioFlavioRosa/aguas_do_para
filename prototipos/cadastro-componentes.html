<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="profile" href="https://gmpg.org/xfn/11">
  <meta name='robots' content='index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1' />

  <link rel='stylesheet' id='hello-elementor-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/reset.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='hello-elementor-theme-style-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/theme.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='hello-elementor-header-footer-css' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/header-footer.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' id='elementor-frontend-css' href='https://www.aegea.com.br/wp-content/plugins/elementor/assets/css/frontend.min.css?ver=3.32.5' media='all' />
  <link rel='stylesheet' id='elementor-post-25733-css' href='https://www.aegea.com.br/wp-content/uploads/elementor/css/post-25733.css?ver=1766510003' media='all' />
  <link rel='stylesheet' id='elementor-post-26397-css' href='https://www.aegea.com.br/wp-content/uploads/elementor/css/post-26397.css?ver=1766510004' media='all' />
  <link rel='stylesheet' id='elementor-post-26421-css' href='https://www.aegea.com.br/wp-content/uploads/elementor/css/post-26421.css?ver=1766510004' media='all' />
  <link rel='stylesheet' id='elementor-post-26997-css' href='https://www.aegea.com.br/wp-content/uploads/elementor/css/post-26997.css?ver=1766510008' media='all' />
  <style>
    .dashboard-header nav a { margin-left: 24px; color: #0027BD; text-decoration: none; font-weight: 600; }
    .dashboard-header nav a.active, .dashboard-header nav a:focus { text-decoration: underline; }
    .disparar-btn { margin-bottom: 0; }
    .edit-input { width: 90px; padding: 4px 6px; border: 1px solid #e2e5f0; border-radius: 6px; font-size:1rem; }
    @media (max-width: 700px) { .prestadores-table th, .prestadores-table td { font-size:0.95rem; } }
  </style>
</head>
<body class="wp-singular">
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h1>Cadastro de Componentes</h1>
      <nav>
        <a href="bloco2-gestao-demandas.html">Gestão de Demandas</a>
        <a href="cadastro-subbacias.html">Sub-bacias</a>
        <a href="cadastro-componentes.html" class="active">Componentes</a>
        <a href="cadastro-sistemas.html">Sistemas/ETEs</a>
      </nav>
      <img src="https://www.aegea.com.br/wp-content/uploads/2024/02/aegea.svg" alt="Logo Aegea" style="height:48px;">
    </div>
    <section aria-label="Cadastro de Componentes">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap;">
        <div>
          <input type="file" id="importPrecos" style="display:none;">
          <label for="importPrecos" class="disparar-btn" style="margin-right:8px;cursor:pointer;">Importar Preços (Excel)</label>
          <button type="button" class="disparar-btn" id="btnSalvar">Salvar Alterações</button>
        </div>
      </div>
      <form id="formComponentes">
      <table class="prestadores-table" aria-label="Tabela de Componentes de Infraestrutura">
        <thead>
          <tr>
            <th scope="col">Componente</th>
            <th scope="col">Unidade</th>
            <th scope="col">CAPEX (R$/unidade)</th>
            <th scope="col">OPEX (R$/unidade/ano)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Rede Coletora</td>
            <td>m</td>
            <td><input type="number" class="edit-input" name="capex0" value="150" min="0" step="0.01"></td>
            <td><input type="number" class="edit-input" name="opex0" value="2.5" min="0" step="0.01"></td>
          </tr>
          <tr>
            <td>Ligação</td>
            <td>un</td>
            <td><input type="number" class="edit-input" name="capex1" value="500" min="0" step="0.01"></td>
            <td><input type="number" class="edit-input" name="opex1" value="5.0" min="0" step="0.01"></td>
          </tr>
          <tr>
            <td>Estação Elevatória</td>
            <td>un</td>
            <td><input type="number" class="edit-input" name="capex2" value="25000" min="0" step="0.01"></td>
            <td><input type="number" class="edit-input" name="opex2" value="1200" min="0" step="0.01"></td>
          </tr>
          <tr>
            <td>Linha de Recalque</td>
            <td>m</td>
            <td><input type="number" class="edit-input" name="capex3" value="180" min="0" step="0.01"></td>
            <td><input type="number" class="edit-input" name="opex3" value="3.0" min="0" step="0.01"></td>
          </tr>
          <tr>
            <td>Coletor Tronco</td>
            <td>m</td>
            <td><input type="number" class="edit-input" name="capex4" value="210" min="0" step="0.01"></td>
            <td><input type="number" class="edit-input" name="opex4" value="3.5" min="0" step="0.01"></td>
          </tr>
          <tr>
            <td>ETE</td>
            <td>un</td>
            <td><input type="number" class="edit-input" name="capex5" value="500000" min="0" step="0.01"></td>
            <td><input type="number" class="edit-input" name="opex5" value="25000" min="0" step="0.01"></td>
          </tr>
        </tbody>
      </table>
      </form>
    </section>
  </div>
  <footer class="main-footer" style="margin-top:48px;">
    <p>&copy; 2026 Nome da Empresa.</p>
  </footer>
  <script>
    // Simula salvar alterações
    document.getElementById('btnSalvar').onclick = function() {
      alert('Alterações salvas com sucesso! (Simulação)');
    };
  </script>
</body>
</html>
