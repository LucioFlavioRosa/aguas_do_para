  <style>
    .dashboard-container { max-width: 1200px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); }
    .dashboard-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .dashboard-header h1 { font-size: 2rem; color: #0027BD; margin: 0; }
    nav.menu-cenarios { margin-bottom: 32px; }
    nav.menu-cenarios a { color: #0027BD; text-decoration: none; margin-right: 24px; font-weight: 600; padding: 4px 12px; border-radius: 8px; transition: background .15s; }
    nav.menu-cenarios a.active, nav.menu-cenarios a:hover { background: #eaf2ff; }
    .cenarios-lista { margin-bottom: 32px; }
    .cenarios-lista label { display: flex; align-items: center; margin-bottom: 10px; font-size: 1.1rem; }
    .cenarios-lista input[type=checkbox] { margin-right: 10px; transform: scale(1.2); }
    .tabela-comparativa { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
    .tabela-comparativa th, .tabela-comparativa td { padding: 12px 8px; border-bottom: 1px solid #e2e5f0; text-align: center; font-size: 1rem; }
    .tabela-comparativa th { background: #f3f6fb; color: #0027BD; font-weight: 700; }
    .tabela-comparativa tr.highlight { background: #eaf2ff; }
    .grafico-comparativo { display: flex; gap: 32px; justify-content: center; margin-bottom: 32px; }
    .grafico-barra { display: flex; flex-direction: column; align-items: center; width: 120px; }
    .grafico-barra .barra { width: 48px; border-radius: 8px 8px 0 0; background: linear-gradient(180deg,#0027BD 80%,#eaf2ff 100%); margin-bottom: 8px; transition: height .3s; }
    .grafico-barra span { font-size: 0.98rem; color: #222; }
    .btn-exportar { background: #0027BD; color: #fff; border: none; border-radius: 8px; padding: 14px 32px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-exportar:disabled { background: #abb8c3; cursor: not-allowed; }
    @media (max-width: 900px) {
      .grafico-comparativo { flex-direction: column; gap: 12px; align-items: center; }
      .grafico-barra { width: 90px; }
      .tabela-comparativa th, .tabela-comparativa td { font-size: 0.95rem; }
    }
  </style>

<body class="wp-singular">
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h1>Comparação de Cenários</h1>
      <img src="https://www.aegea.com.br/wp-content/uploads/2024/02/aegea.svg" alt="Logo Aegea" style="height:48px;">
    </div>
    <nav class="menu-cenarios" aria-label="Menu de navegação">
      <a href="gestao-demandas.html">Gestão de Demandas</a>
      <a href="comparacao-cenarios.html" class="active" aria-current="page">Comparação de Cenários</a>
      <a href="simulacao.html">Simulação</a>
    </nav>
    <form id="form-cenarios" autocomplete="off" aria-label="Seleção de cenários para comparação">
      <div class="cenarios-lista">
        <strong>Selecione até 3 simulações salvas:</strong>
        <div id="lista-cenarios">
          <!-- Lista de cenários mockada pelo JS -->
        </div>
      </div>
      <button type="button" class="btn-exportar" id="btnExportar" disabled>Exportar Comparação</button>
    </form>
    <section aria-label="Tabela comparativa de métricas" style="margin-top:32px;">
      <table class="tabela-comparativa" id="tabelaComparativa">
        <!-- Conteúdo dinâmico JS -->
      </table>
    </section>
    <section aria-label="Gráficos comparativos" style="margin-top:32px;">
      <div class="grafico-comparativo" id="graficoComparativo">
        <!-- Gráficos mockados por JS -->
      </div>
    </section>
  </div>
  <footer class="main-footer" style="margin-top:40px;text-align:center;color:#666;font-size:0.98rem;">
    <p>&copy; 2026 Águas do Pará / Aegea. Projeto Algoritmo para Priorização de Investimentos.</p>
  </footer>
  <script src="js/mock-data.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    // Carregar lista de simulações mockadas
    const listaCenarios = document.getElementById('lista-cenarios');
    const tabelaComparativa = document.getElementById('tabelaComparativa');
    const graficoComparativo = document.getElementById('graficoComparativo');
    let selecionados = [];
    function renderListaCenarios() {
      listaCenarios.innerHTML = '';
      mockResultadosSimulacoes.forEach((sim, idx) => {
        const id = `cenario_${sim.id}`;
        const label = document.createElement('label');
        label.innerHTML = `<input type='checkbox' name='cenario' value='${sim.id}' id='${id}' aria-label='Selecionar cenário ${sim.nome}'> ${sim.nome} <span style='color:#666;font-size:0.98rem;'>(Executado em ${sim.data})</span>`;
        listaCenarios.appendChild(label);
      });
    }
    function atualizarSelecionados() {
      const checks = listaCenarios.querySelectorAll('input[type=checkbox]');
      selecionados = Array.from(checks).filter(cb => cb.checked).map(cb => cb.value);
      // Limitar a 3
      checks.forEach(cb => {
        if (!cb.checked && selecionados.length >= 3) cb.disabled = true;
        else cb.disabled = false;
      });
      document.getElementById('btnExportar').disabled = selecionados.length === 0;
      renderComparacao();
    }
    function renderComparacao() {
      if (selecionados.length === 0) {
        tabelaComparativa.innerHTML = '';
        graficoComparativo.innerHTML = '';
        return;
      }
      const cenarios = mockResultadosSimulacoes.filter(s => selecionados.includes(s.id.toString()));
      // Cabeçalho
      let html = '<tr><th>Métrica</th>' + cenarios.map(c => `<th>${c.nome}</th>`).join('') + '</tr>';
      const metricas = [
        { label: 'VPL (R$ mil)', key: 'vpl' },
        { label: 'CAPEX (R$ mil)', key: 'capex' },
        { label: 'Cobertura (%)', key: 'cobertura' },
        { label: 'Extensão de Rede (km)', key: 'extensao' },
        { label: 'Ligações', key: 'ligacoes' },
        { label: 'Faturamento (R$ mil)', key: 'faturamento' },
        { label: 'Arrecadação (R$ mil)', key: 'arrecadacao' }
      ];
      metricas.forEach(m => {
        html += `<tr><td style='text-align:left;'>${m.label}</td>` + cenarios.map(c => `<td>${c[m.key]}</td>`).join('') + '</tr>';
      });
      tabelaComparativa.innerHTML = html;
      // Gráficos
      graficoComparativo.innerHTML = '';
      // Exemplo: gráfico de barras de VPL
      const maxVPL = Math.max(...cenarios.map(c => c.vpl));
      graficoComparativo.innerHTML += '<div style="font-weight:600;color:#0027BD;width:100%;text-align:center;margin-bottom:12px;">VPL (R$ mil)</div>';
      graficoComparativo.innerHTML += cenarios.map(c => {
        const h = Math.round(120 * (c.vpl / maxVPL));
        return `<div class='grafico-barra'><div class='barra' style='height:${h}px;'></div><span>${c.nome}</span><span style='color:#0027BD;font-weight:600;'>${c.vpl}</span></div>`;
      }).join('');
    }
    renderListaCenarios();
    listaCenarios.addEventListener('change', atualizarSelecionados);
    atualizarSelecionados();
    // Exportar comparação
    document.getElementById('btnExportar').onclick = function() {
      let csv = 'Métrica;';
      const cenarios = mockResultadosSimulacoes.filter(s => selecionados.includes(s.id.toString()));
      csv += cenarios.map(c => c.nome).join(';') + '\n';
      const metricas = [
        { label: 'VPL (R$ mil)', key: 'vpl' },
        { label: 'CAPEX (R$ mil)', key: 'capex' },
        { label: 'Cobertura (%)', key: 'cobertura' },
        { label: 'Extensão de Rede (km)', key: 'extensao' },
        { label: 'Ligações', key: 'ligacoes' },
        { label: 'Faturamento (R$ mil)', key: 'faturamento' },
        { label: 'Arrecadação (R$ mil)', key: 'arrecadacao' }
      ];
      metricas.forEach(m => {
        csv += m.label + ';' + cenarios.map(c => c[m.key]).join(';') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'comparacao-cenarios.csv';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    };
    // Navegação ativa
    setActiveNav('comparacao-cenarios.html');
  </script>
</body>
</html>
