<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador WhatsApp - Cadastro Parceiro Águas do Pará</title>
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-includes/css/dist/block-library/style.min.css?ver=6.8.3" media="all" />
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/reset.css?ver=3.4.5" media="all" />
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/theme.css?ver=3.4.5" media="all" />
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/header-footer.css?ver=3.4.5" media="all" />
  <link rel="stylesheet" href="https://www.aegea.com.br/wp-content/plugins/elementor/assets/css/frontend.min.css?ver=3.32.5" media="all" />
  <style>
    body {
      background: #e5ddd5;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wa-sim-container {
      max-width: 420px;
      margin: 24px auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }
    .wa-header {
      background: #075e54;
      color: #fff;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .wa-header img {
      border-radius: 50%;
      width: 44px;
      height: 44px;
      object-fit: cover;
      border: 2px solid #fff;
    }
    .wa-header .wa-title {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .wa-chat {
      flex: 1;
      padding: 16px;
      background: #ece5dd;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .wa-msg {
      max-width: 75%;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 1rem;
      line-height: 1.4;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .wa-msg.bot {
      background: #fff;
      align-self: flex-start;
      color: #222;
      border-bottom-left-radius: 2px;
    }
    .wa-msg.user {
      background: #dcf8c6;
      align-self: flex-end;
      color: #222;
      border-bottom-right-radius: 2px;
    }
    .wa-msg .wa-time {
      font-size: 0.75rem;
      color: #888;
      margin-left: 8px;
    }
    .wa-input-bar {
      background: #f7f7f7;
      padding: 12px 12px 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #ddd;
    }
    .wa-input-bar input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 20px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }
    .wa-input-bar button {
      background: #075e54;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .2s;
      font-size: 1.2rem;
    }
    .wa-input-bar button:focus {
      outline: 2px solid #0027BD;
    }
    .wa-checklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0;
    }
    .wa-checklist label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
    }
    .wa-upload {
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .wa-upload input[type="file"] {
      display: block;
    }
    /* Responsividade */
    @media (max-width: 600px) {
      .wa-sim-container {
        max-width: 100vw;
        height: 100vh;
        border-radius: 0;
        margin: 0;
      }
      .wa-header {
        padding: 10px;
      }
      .wa-chat {
        padding: 8px;
      }
      .wa-input-bar {
        padding: 8px 8px 4px 8px;
      }
    }
    /* Acessibilidade: contraste e foco */
    .wa-msg.bot, .wa-msg.user {
      outline: none;
    }
    .wa-msg:focus {
      box-shadow: 0 0 0 2px #0027BD;
    }
  </style>
</head>
<body>
  <main class="wa-sim-container" role="main" aria-label="Simulador de Conversa WhatsApp">
    <header class="wa-header" role="banner">
      <img src="https://www.aegea.com.br/wp-content/uploads/2024/02/aegea.svg" alt="Logo Aegea" width="44" height="44">
      <div>
        <div class="wa-title">Aegea Parceiros</div>
        <div style="font-size:0.9rem;">online</div>
      </div>
    </header>
    <section class="wa-chat" id="wa-chat" aria-live="polite" tabindex="0">
      <!-- Mensagens renderizadas por JS -->
    </section>
    <form class="wa-input-bar" id="wa-form" autocomplete="off" aria-label="Enviar mensagem">
      <input type="text" id="wa-input" placeholder="Digite sua mensagem" aria-label="Digite sua mensagem" tabindex="0" required>
      <button type="submit" aria-label="Enviar mensagem" tabindex="0">➤</button>
    </form>
  </main>
  <script>
    // Simulação do fluxo do Bloco 1 (Cadastro via WhatsApp)
    const chat = document.getElementById('wa-chat');
    const form = document.getElementById('wa-form');
    const input = document.getElementById('wa-input');
    let step = 0;
    let userData = {};
    let checklistServicos = [
      'Reparo de vazamentos de água',
      'Instalação/Troca de hidrômetros',
      'Desobstrução de esgoto',
      'Pequenos reparos (alvenaria/calçada)',
      'Outros'
    ];
    let checklistRecursos = [
      'Veículo (Moto/Carro)',
      'Ferramentas básicas',
      'Manhã',
      'Tarde',
      'Noite',
      'Fim de semana',
      'Dias da semana',
      'Feriado'
    ];
    function horaAgora() {
      const d = new Date();
      return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }
    function addMsg(text, sender = 'bot', html = false) {
      const msg = document.createElement('div');
      msg.className = `wa-msg ${sender}`;
      msg.setAttribute('tabindex', '0');
      msg.setAttribute('role', 'region');
      if(html) msg.innerHTML = text + `<span class="wa-time">${horaAgora()}</span>`;
      else msg.textContent = text;
      if(!html) {
        const time = document.createElement('span');
        time.className = 'wa-time';
        time.textContent = horaAgora();
        msg.appendChild(time);
      }
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }
    function showChecklist(items, name) {
      const form = document.createElement('form');
      form.className = 'wa-checklist';
      form.setAttribute('aria-label', 'Selecione as opções desejadas');
      items.forEach((item, i) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" name="${name}" value="${item}" tabindex="0"> ${item}`;
        form.appendChild(label);
      });
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.textContent = 'Confirmar';
      btn.className = 'elementor-button elementor-size-sm';
      btn.setAttribute('aria-label', 'Confirmar seleção');
      btn.style.marginTop = '8px';
      form.appendChild(btn);
      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        const checked = Array.from(form.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);
        if(checked.length === 0) return;
        addMsg(checked.join(', '), 'user');
        if(name === 'servicos') {
          userData.servicos = checked;
          step++;
          setTimeout(nextStep, 600);
        } else {
          userData.recursos = checked;
          step++;
          setTimeout(nextStep, 600);
        }
        form.parentElement.remove();
      });
      const wrap = document.createElement('div');
      wrap.appendChild(form);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }
    function showUpload(tipo) {
      const div = document.createElement('div');
      div.className = 'wa-upload';
      div.innerHTML = `<label for="${tipo}-file">Envie uma foto da ${tipo}:</label><input type="file" id="${tipo}-file" accept="image/*" aria-label="Upload de foto da ${tipo}" tabindex="0">`;
      const inputFile = div.querySelector('input');
      inputFile.addEventListener('change', function(){
        if(inputFile.files.length) {
          addMsg(`Foto da ${tipo} enviada.`, 'user');
          userData[tipo] = inputFile.files[0].name;
          step++;
          setTimeout(nextStep, 600);
          div.remove();
        }
      });
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    function showTermoAceite() {
      const div = document.createElement('div');
      div.className = 'wa-upload';
      div.innerHTML = `<label><input type="checkbox" id="termo-aceite" aria-label="Aceito os termos" tabindex="0"> Li e aceito os <a href='https://www.aegea.com.br/politica-de-privacidade-e-protecao-de-dados-da-aegea/' target='_blank'>Termos de Privacidade</a>.</label><button class='elementor-button elementor-size-sm' id='btn-termo' aria-label='Aceitar termo' tabindex='0'>Aceitar</button>`;
      div.querySelector('#btn-termo').addEventListener('click', function(ev){
        ev.preventDefault();
        if(div.querySelector('#termo-aceite').checked) {
          addMsg('Termo aceito.', 'user');
          userData.termo = true;
          step++;
          setTimeout(nextStep, 600);
          div.remove();
        }
      });
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    function nextStep(userInput) {
      switch(step) {
        case 0:
          addMsg('Olá! 👋 Obrigado pelo seu interesse em ser um Parceiro Águas do Pará. Para começarmos, por favor, informe seu CNPJ para verificação jurídica.', 'bot');
          step++;
          break;
        case 1:
          if(userInput) userData.cnpj = userInput;
          addMsg('Aguarde um instante enquanto verificamos seu CNPJ...');
          setTimeout(()=>{
            addMsg('CNPJ validado com sucesso! Veja como funciona o programa no vídeo abaixo:', 'bot');
            addMsg('<video width="100%" controls aria-label="Vídeo explicativo"><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">Seu navegador não suporta vídeo.</video>', 'bot', true);
            setTimeout(()=>{
              addMsg('Você possui um celular com WhatsApp, câmera e GPS funcionando no seu dia a dia?', 'bot');
              step++;
            }, 2500);
          }, 1200);
          break;
        case 2:
          if(userInput && userInput.toLowerCase().includes('sim')) {
            addMsg('Ótimo! Agora, por favor, informe seus dados básicos: Nome completo, Endereço, E-mail e o raio de atuação (em km).', 'bot');
            step++;
          } else {
            addMsg('Infelizmente, é necessário ter um celular com WhatsApp, câmera e GPS para participar do programa. Caso atenda a esses requisitos, responda "Sim" para continuar.', 'bot');
          }
          break;
        case 3:
          if(userInput) {
            userData.dados = userInput;
            addMsg('Agora selecione os serviços que você pode realizar:', 'bot');
            showChecklist(checklistServicos, 'servicos');
          }
          break;
        case 4:
          addMsg('Ótimo! Agora selecione seus recursos e disponibilidade:', 'bot');
          showChecklist(checklistRecursos, 'recursos');
          break;
        case 5:
          addMsg('Para finalizar, envie uma foto da sua CNH e uma selfie segurando a CNH.', 'bot');
          showUpload('CNH');
          break;
        case 6:
          addMsg('Agora, informe sua chave PIX para pagamentos.', 'bot');
          step++;
          break;
        case 7:
          if(userInput) {
            userData.pix = userInput;
            addMsg('Por fim, aceite os termos de participação para concluir seu cadastro.', 'bot');
            showTermoAceite();
          }
          break;
        case 8:
          addMsg('Cadastro concluído! 🎉 Você agora faz parte da base de parceiros ativos da Águas do Pará. Aguarde que entraremos em contato para oportunidades de serviço.', 'bot');
          break;
      }
    }
    // Inicialização
    nextStep();
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      const val = input.value.trim();
      if(!val) return;
      addMsg(val, 'user');
      setTimeout(()=>{
        nextStep(val);
      }, 600);
      input.value = '';
    });
    // Acessibilidade: scroll automático ao receber mensagens
    chat.addEventListener('DOMNodeInserted', function(){
      chat.scrollTop = chat.scrollHeight;
    });
  </script>
</body>
</html>
