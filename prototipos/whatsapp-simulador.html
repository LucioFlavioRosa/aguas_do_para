<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onboarding WhatsApp – MVP Parceiro Águas do Pará</title>
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-includes/css/dist/block-library/style.min.css?ver=6.8.3' media='all' />
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/reset.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/theme.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/header-footer.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-content/plugins/elementor/assets/css/frontend.min.css?ver=3.32.5' media='all' />
  <script src="js/main.js" defer></script>
  <style>
    body { background: #eceff1; }
    .wa-container { max-width: 420px; margin: 32px auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.09); padding: 0; }
    .wa-header { background: #075e54; color: #fff; padding: 16px; border-radius: 16px 16px 0 0; display: flex; align-items: center; }
    .wa-header img { width: 36px; height: 36px; border-radius: 50%; margin-right: 12px; }
    .wa-header .wa-title { font-weight: 600; font-size: 1.1em; }
    #whatsapp-chat { min-height: 320px; max-height: 480px; overflow-y: auto; background: #e5ddd5; padding: 16px; }
    .wa-msg { margin: 8px 0; padding: 12px 16px; border-radius: 16px; max-width: 80%; display: inline-block; font-size: 1em; }
    .wa-bot { background: #fff; color: #222; border-bottom-left-radius: 4px; }
    .wa-user { background: #dcf8c6; color: #222; float: right; border-bottom-right-radius: 4px; }
    .wa-options { margin: 12px 0; }
    .wa-opt-btn { background: #25d366; color: #fff; border: none; border-radius: 8px; margin: 0 6px 6px 0; padding: 10px 18px; cursor: pointer; font-size: 1em; }
    .wa-opt-btn:hover { background: #1ebe57; }
    .wa-input, .wa-input[type='text'], .wa-input[type='email'] { width: 100%; margin: 6px 0; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1em; }
    .wa-container form { margin: 8px 0; }
    .wa-container button[type='submit'] { background: #075e54; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 1em; margin-top: 8px; }
    .wa-container button[type='submit']:hover { background: #128c7e; }
    .wa-footer { text-align: center; padding: 12px 0; background: #f7f7f7; border-radius: 0 0 16px 16px; }
    @media (max-width: 520px) { .wa-container { max-width: 100%; border-radius: 0; } }
  </style>
</head>
<body>
  <div class="wa-container">
    <div class="wa-header">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp"/>
      <span class="wa-title">Aegea Parceiros</span>
    </div>
    <div id="whatsapp-chat"></div>
    <div class="wa-footer">
      <button class="btn" data-navigate="index.html">Voltar ao início</button>
    </div>
  </div>
</body>
</html>
