<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Execução do Serviço – MVP Parceiro Águas do Pará</title>
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-includes/css/dist/block-library/style.min.css?ver=6.8.3' media='all' />
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/reset.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/theme.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-content/themes/hello-elementor/assets/css/header-footer.css?ver=3.4.5' media='all' />
  <link rel='stylesheet' href='https://www.aegea.com.br/wp-content/plugins/elementor/assets/css/frontend.min.css?ver=3.32.5' media='all' />
  <script src="js/main.js" defer></script>
  <style>
    body { background: #f7f9fc; }
    .container { max-width: 520px; margin: 32px auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.09); padding: 32px 24px; }
    h2 { color: #0027BD; margin-bottom: 16px; }
    .step { margin-bottom: 24px; }
    .label { font-weight: 600; color: #0027BD; }
    .photo-preview { display: block; margin: 12px 0; max-width: 180px; border-radius: 8px; border: 1px solid #e0e0e0; }
    .btn { background: #0027BD; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 1em; cursor: pointer; margin: 0 6px 6px 0; }
    .btn:hover { background: #0053ff; }
    textarea { width: 100%; min-height: 60px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; margin: 8px 0; }
    @media (max-width: 600px) { .container { max-width: 100%; } }
  </style>
</head>
<body>
  <div class="container">
    <h2>Execução do Serviço – Parceiro</h2>
    <div class="step">
      <div class="label">1. Chegada ao local – Foto 'Antes' com localização:</div>
      <input type="file" class="photo-upload" data-preview="preview-antes" accept="image/*" aria-label="Foto antes do serviço"/>
      <img id="preview-antes" class="photo-preview" alt="Prévia da foto antes"/>
      <button class="btn" onclick="alert('Foto enviada via WhatsApp (simulado)')">Enviar Foto + Localização</button>
    </div>
    <div class="step">
      <div class="label">2. Execução do serviço</div>
      <textarea placeholder="Descreva brevemente o que foi feito"></textarea>
    </div>
    <div class="step">
      <div class="label">3. Finalização – Foto 'Depois' com localização:</div>
      <input type="file" class="photo-upload" data-preview="preview-depois" accept="image/*" aria-label="Foto depois do serviço"/>
      <img id="preview-depois" class="photo-preview" alt="Prévia da foto depois"/>
      <button class="btn" onclick="alert('Foto enviada via WhatsApp (simulado)')">Enviar Foto + Localização</button>
    </div>
    <div class="step">
      <div class="label">4. Não conseguiu executar?</div>
      <textarea placeholder="Explique o motivo e envie foto"></textarea>
      <input type="file" class="photo-upload" data-preview="preview-falha" accept="image/*" aria-label="Foto justificativa"/>
      <img id="preview-falha" class="photo-preview" alt="Prévia da foto justificativa"/>
      <button class="btn" onclick="alert('Justificativa enviada via WhatsApp (simulado)')">Enviar Justificativa</button>
    </div>
    <button class="btn" data-navigate="index.html">Voltar ao início</button>
  </div>
</body>
</html>
